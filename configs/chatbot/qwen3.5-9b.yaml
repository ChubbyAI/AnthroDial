# Set your own OpenAI-compatible endpoints and environment variables.
llm:
  base_url: http://localhost:8000/v1
  default_model: Qwen3.5-9B
  extra_body: {}
  models:
    benchmark_judge: Judge-Qwen3.5-397B-A17B
    ref_partner: Qwen3.5-397B-A17B
    persona_chat: Qwen3.5-9B
    memory_updater: Qwen3.5-9B
    compressor: Compressor-Qwen3.5-397B-A17B
  temperature:
    benchmark_judge: 0.0
    ref_partner: 0.9
    persona_chat: 0.9
    memory_updater: 0.2
    compressor: 0.2
  request:
    max_retries: 10
    timeout: 300
  model_configs:
    Qwen3.5-397B-A17B:
      enable_thinking: false
      base_url: http://localhost:8000/v1
      api_key_env: OPENAI_API_KEY
    Compressor-Qwen3.5-397B-A17B:
      enable_thinking: false
      api_model: Qwen3.5-397B-A17B
      base_url: http://localhost:8000/v1
      api_key_env: OPENAI_API_KEY
    Qwen3.5-9B:
      enable_thinking: false
      base_url: http://localhost:8000/v1
      api_key_env: OPENAI_API_KEY
    Judge-Qwen3.5-397B-A17B:
      enable_thinking: false
      api_model: Qwen3.5-397B-A17B
      base_url: http://localhost:8000/v1
      api_key_env: JUDGE_API_KEY
  api_key_env: OPENAI_API_KEY
paths:
  data_dir: data/chatbot_benchmark
  personas_dir: data/chatbot_benchmark/personas
  scenarios_dir: data/chatbot_benchmark/scenarios
  outputs_dir: runs/chatbot/outputs
  results_dir: runs/chatbot/results
  prompt_components_dir: src/chat/prompts/chatbot
  skills_dir: data/chatbot_benchmark/skills
session:
  max_turns: 100
  reply_max_segments: 4
  max_consecutive_same_speaker: 6
  min_send_interval_ms: 3000
  consecutive_delay_schedule_ms:
  - 3000
  - 3000
  - 5000
  - 20000
  - 60000
  - 180000
  - 600000
  - 3600000
  - 43200000
  - 86400000
compression:
  fold_interval: 20
  keep_recent_turns: 10
  fold_max_chars: 300
memory:
  max_points_per_partner: 12
benchmark:
  tested_model: Qwen3.5-9B
  sample: null
  concurrency: 5
  quiet: false
  enable_memory: false
  force: false
  per_turn_weight: 0.5
  holistic_weight: 0.5
  rubric_path: data/chatbot_benchmark/rubric.yaml
  bindings_path: data/chatbot_benchmark/bindings.yaml
  self_play: true
  single_role: false
  domain: chatbot
